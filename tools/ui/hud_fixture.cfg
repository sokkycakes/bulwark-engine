// Bulwark - fixed HUD values for screenshot tests of Stiletto's HUD, the
// same in the Panorama build (layout/web/hud.xml, which reads them through
// gethud and cvar:) and the native one (uin_hud.c, which reads the cvars).
//
// These are the cvars the client game publishes every frame in a match
// (HeroActions_PublishHud, hud.qc WebCoreHud_Draw), so set them where the
// client game isn't drawing the HUD: on the title, over its backdrop map
// (serverinfo background 1, so CSQC skips its HUD). See tools/ui/uidiff.py
// for the whole recipe. Values: design 8 ui_native_hudtest.
//
// Copy it into the game dir the test runs from (exec reads game files),
// e.g. stbuilt/hud_fixture.cfg, then: exec hud_fixture.cfg

set webcore_hud_speed 0
set webcore_hud_timer "0:00"
set webcore_hud_score_left 0
set webcore_hud_score_right 0
set webcore_hud_player1 "Player1"
set webcore_hud_player2 "Player2"
set webcore_hud_health 4
set webcore_hud_health_max 4
set webcore_hud_ammo 6
set webcore_hud_clip 6
set webcore_hud_ammo_max 6
set webcore_hud_reload 0
set webcore_hud_charges 3
set webcore_hud_ex 3
set webcore_hud_ex_max 3
set webcore_hud_drive 1000
set webcore_hud_drive_max 1000
