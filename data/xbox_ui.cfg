// Bulwark on the Xbox: settings over the game's own configs.
// main.c runs this (Xbox builds only) after the game's quake.rc and
// autoexec.cfg. The disc carries it in D:\data, Bulwark's engine data.

// The lobby the native UI's CREATE GAME opens: a deathmatch on a map the
// bots have waypoints for (data/<map>.way), seats for the four pads and
// four bots. A disc without lqdm4 gets the first installed map instead
// (uin_lobby.c).
set lobby_defaultruleset DEATHMATCH
set lobby_defaultmap lqdm4
set lobby_maxplayers 8

// The title's backdrop map (Stiletto's autoexec sets background02) stays:
// its memory cost on the console is still to be measured (P3). To drop it:
// set webcore_menumap ""
