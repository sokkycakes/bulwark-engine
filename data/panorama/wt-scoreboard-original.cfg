// Opens the team match header demo drawn with WolfTeam's own art
// (layout/hud/wt-scoreboard-original.xml; needs the private
// images/hud/wt-private/ pack). IBM Plex Sans comes from the base game's
// fonts/. "input" keeps the console from covering it when no map is
// running; close it with `ui_close all`.
ui_font "IBM Plex Sans" fonts/IBMPlexSans-Bold.otf 700
ui_open layout/hud/wt-scoreboard-original.xml input
