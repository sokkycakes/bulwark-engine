// Opens the WolfTeam-style team match header demo
// (layout/hud/wt-scoreboard-demo.xml: the panel over a sky backdrop, with
// the clock running). Fonts are registered first, since a layout's styles
// are read when it opens. Saira Condensed is SIL OFL (licence beside it);
// IBM Plex Sans comes from the base game's fonts/. Missing files are skipped.
// A HUD opens layout/hud/wt-scoreboard.xml instead and posts "state".
ui_font "Saira Condensed" panorama/fonts-hud/SairaCondensed-SemiBold.ttf 600
ui_font "Saira Condensed" panorama/fonts-hud/SairaCondensed-Bold.ttf 700
ui_font "IBM Plex Sans" fonts/IBMPlexSans-Bold.otf 700
// "input" keeps the console from covering it when no map is running;
// close it with `ui_close all`.
ui_open layout/hud/wt-scoreboard-demo.xml input
