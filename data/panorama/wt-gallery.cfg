// Opens the WolfTeam theme gallery (layout/wt/gallery.xml). The theme's
// fonts must exist before the layout's styles are read, so they are
// registered first; both are SIL OFL (licences beside them in
// panorama/fonts-wt/). The last two lines are the private pack (WolfTeam's
// own Square721 BT Bold and Gulim, never in git); they only warn when the
// pack is not installed. "input" keeps the console from covering the view
// when no map is running; close it with `ui_close all`.
ui_font "Russo One" panorama/fonts-wt/RussoOne-Regular.ttf 700
ui_font "Liberation Sans" panorama/fonts-wt/LiberationSans-Regular.ttf 400
ui_font "Liberation Sans" panorama/fonts-wt/LiberationSans-Bold.ttf 700
ui_font "Square721 BT" panorama/fonts-wt/wt-private/sqr721b.ttf 700
ui_font "Gulim" panorama/fonts-wt/wt-private/gulim.ttc 400
ui_open layout/wt/gallery.xml input
