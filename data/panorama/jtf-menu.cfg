// Opens the JTF main menu (layout/qt/jtf-menu.xml). Its fonts must exist
// before the layout's styles are read, so they are registered first.
// Both are SIL OFL (licences beside them in panorama/fonts-jtf/).
ui_font "Iceberg" panorama/fonts-jtf/Iceberg-Regular.ttf
ui_font "Kode Mono" panorama/fonts-jtf/KodeMono-Regular.ttf
ui_open layout/qt/jtf-menu.xml
